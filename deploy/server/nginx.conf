# qa-eval 服务器部署网关配置（构建时打进 web 镜像：/etc/nginx/conf.d/default.conf）
#
# - 前端静态资源 + SPA 回退
# - /api/ 反向代理到 compose 内部网络上的 api:8000（同源，无跨域）
# - 整站免密访问（内网部署约定；如需重新启用 Basic Auth，恢复 auth_basic
#   两行并在 compose web 服务重新挂载 htpasswd，详见 git 历史）
# - /healthz 供容器健康检查（只暴露存活状态，无数据）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 数据集原始文件上传（.jsonl/.parquet）可能较大
    client_max_body_size 2g;

    # 上传处理 / 评测触发等同步请求可能较长（大文件解析、快照生成）
    proxy_connect_timeout 60s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 整站免密（永久约定，见文件头注释） ----

    # 容器健康检查：返回存活标记
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---- API 反向代理（容器内部网络，不经过宿主机端口） ----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传直通后端，不在 nginx 侧落盘缓存
        proxy_request_buffering off;
    }

    # 带内容 hash 的静态资源可长缓存
    location ~* ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
