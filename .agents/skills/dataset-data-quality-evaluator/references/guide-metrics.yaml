schema_version: "1.0"
name: guide-metrics
catalog_scope: full_guide_reference
skill_owned_dimension: 数据质量
ownership_note: >
  本文件保留三个维度的指南原文，作为只读来源目录；本 Skill 只能设计和执行
  0201–0208 及其模态子指标。0101–0104 和 0301–0305 分别由其他 Skill 所有。
sources:
  guide_metrics: plan/v0/pm-v0.md
  metric_definition_design: plan/v0/rd-v0.md
metric_definition_alignment:
  definition_describes_semantics: true
  implementation_is_separate: true
  semantic_change_requires_version_change: true

dimensions:
  - name: 说明文档
    node_type: dimension
    declared_total_weight: 1.00
    total_row_name: 说明文档指标得分
  - name: 数据质量
    node_type: dimension
    declared_total_weight: 1.000
    total_row_name: 数据质量指标得分
  - name: 模型应用
    node_type: dimension
    declared_total_weight: 1.00
    total_row_name: 模型应用指标得分

metrics:
  - code: "0101"
    name: 基本信息完整性
    node_type: metric
    dimension: 说明文档
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据集
    requirement: 说明文档应包含数据集规模、格式规范、文件结构、访问渠道、技术支持方式等基本信息。
    measurement_method: X = A / B，其中 A 为满足基本信息完整性要求的方面数量，B 为应满足的方面总数。

  - code: "0102"
    name: 内容特征完整性
    node_type: metric
    dimension: 说明文档
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据集
    requirement: 说明文档应包含模态类型、数据分布情况、标签类别统计、样本示例、局限性说明等内容特征。
    measurement_method: X = A / B，其中 A 为满足内容特征完整性要求的方面数量，B 为应满足的方面总数。

  - code: "0103"
    name: 建设过程完整性
    node_type: metric
    dimension: 说明文档
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据集
    requirement: 说明文档应包含数据来源、采集方法、加工处理流程、标注规范、版本控制记录等建设过程。
    measurement_method: X = A / B，其中 A 为满足建设过程完整性要求的方面数量，B 为应满足的方面总数。

  - code: "0104"
    name: 应用说明完整性
    node_type: metric
    dimension: 说明文档
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据集
    requirement: 说明文档应包含使用许可、目标应用场景、评估方法、基准测试结果、典型应用案例等应用说明。
    measurement_method: X = A / B，其中 A 为满足应用说明完整性要求的方面数量，B 为应满足的方面总数。

  - code: "0201"
    name: 格式规范性
    node_type: metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 数据格式符合预定标准，可直接用于模型开发和训练。预定标准可为相关标准、惯例或自定义规则。
    measurement_method: X = A / B，其中 A 为格式符合预定标准的数据记录数量，B 为数据记录总数。

  - code: "0202"
    name: 安全规范性
    node_type: metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 数据符合模型开发和训练安全要求，不包含违反社会主义核心价值观、歧视性内容、商业违法违规、侵犯他人合法权益等非法内容。
    measurement_method: X = A / B，其中 A 为符合安全要求的数据记录数量，B 为数据记录总数。

  - code: "0203"
    name: 标注规范性
    node_type: metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 标注符合预定标注规范，遵循预先设定的规范化流程；无监督机器学习等不需要标注的场景不适用。
    measurement_method: X = A / B，其中 A 为符合预定标注规范的数据记录数量，B 为数据记录总数。

  - code: "0204"
    name: 结构完整性
    node_type: metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 数据填充完整，不包含缺失值，或缺失值在合理范围内。
    measurement_method: X = A / B，其中 A 为缺失值在合理范围内的数据记录数量，B 为数据记录总数。

  - code: "0205"
    name: 内容真实性
    node_type: metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 数据真实可追溯。非生成数据可追溯到采集源头并与源头一致；生成数据可追溯到生成算法和过程，并符合目标场景真实数据分布规律。
    measurement_method: X = A / B，其中 A 为真实可追溯的数据记录数量，B 为数据记录总数。

  - code: "0206"
    name: 内容一致性
    node_type: metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 相关联数据在语义和表达上保持匹配，包括不同模态数据间一致性和同模态数据间一致性。
    measurement_method: X = A / B，其中 A 为内容一致的数据记录数量，B 为数据记录总数。

  - code: "0207"
    name: 类型一致性
    node_type: metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 数据符合所属数据集类型要求。通识数据集蕴含通用知识，行业通识数据集蕴含行业领域通用知识，行业专识数据集蕴含行业领域专业知识。
    measurement_method: X = A / B，其中 A 为符合所属数据集类型要求的数据记录数量，B 为数据记录总数。

  - code: "0208"
    name: 内容干净性
    node_type: parent_metric
    dimension: 数据质量
    parent_code: null
    modality_group: null
    weight: 0.125
    target_data_form: 数据记录
    requirement: 数据经过严格清洗处理，不包含脏数据；分模态细分细则如下。
    measurement_method: X = A / B，其中 A 为内容干净的数据记录数量，B 为数据记录总数。

  - code: "02080101"
    name: 文本困惑程度（PPL）
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 文本模态
    weight: null
    target_data_form: null
    requirement: 衡量文本语言流畅度，困惑度越小，文本越通顺自然，越符合语言表达规律。
    measurement_method: null

  - code: "02080102"
    name: 知识信息密度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 文本模态
    weight: null
    target_data_form: null
    requirement: 衡量文本中有效知识信息的丰富程度。
    measurement_method: null

  - code: "02080103"
    name: 重复内容程度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 文本模态
    weight: null
    target_data_form: null
    requirement: 衡量文档、段落、句子之间存在重复内容的程度。
    measurement_method: null

  - code: "02080104"
    name: 文本完整程度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 文本模态
    weight: null
    target_data_form: null
    requirement: 衡量文本内容过短或不完整的程度。
    measurement_method: null

  - code: "02080105"
    name: 信息缺失程度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 文本模态
    weight: null
    target_data_form: null
    requirement: 衡量标题、句子、段落等关键结构要素缺失程度。
    measurement_method: null

  - code: "02080106"
    name: 文本纯净程度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 文本模态
    weight: null
    target_data_form: null
    requirement: 衡量广告、页码、特殊符号、乱码等干扰内容存在程度。
    measurement_method: null

  - code: "02080107"
    name: 文本连贯程度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 文本模态
    weight: null
    target_data_form: null
    requirement: 衡量主题与内容一致性，以及是否存在异常截断、错别字等问题。
    measurement_method: null

  - code: "02080201"
    name: 图像分辨率
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 图像模态
    weight: null
    target_data_form: null
    requirement: 衡量图像像素尺寸大小，通常以宽 × 高像素表示。
    measurement_method: null

  - code: "02080202"
    name: 图像重复度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 图像模态
    weight: null
    target_data_form: null
    requirement: 衡量数据集中相同或高度相似图像的重复程度。
    measurement_method: null

  - code: "02080203"
    name: 图像信噪比
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 图像模态
    weight: null
    target_data_form: null
    requirement: 衡量图像中有效信号与噪声的比值，数值越高表示图像质量越好。
    measurement_method: null

  - code: "02080204"
    name: 图像清晰度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 图像模态
    weight: null
    target_data_form: null
    requirement: 衡量视觉清晰程度，不应存在水印、抖动、字幕干扰、条纹等问题。
    measurement_method: null

  - code: "02080301"
    name: 视频分辨率
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 视频模态
    weight: null
    target_data_form: null
    requirement: 衡量视频像素尺寸大小，通常以宽 × 高像素表示。
    measurement_method: null

  - code: "02080302"
    name: 视频重复度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 视频模态
    weight: null
    target_data_form: null
    requirement: 衡量数据集中相同或高度相似视频的重复程度。
    measurement_method: null

  - code: "02080303"
    name: 视频帧率（FPS）
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 视频模态
    weight: null
    target_data_form: null
    requirement: 衡量视频每秒播放帧数，帧率越高，播放越流畅。
    measurement_method: null

  - code: "02080304"
    name: 视频时长
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 视频模态
    weight: null
    target_data_form: null
    requirement: 衡量视频播放时间长度，时长过短可能导致内容不完整或信息量不足。
    measurement_method: null

  - code: "02080305"
    name: 视频清晰度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 视频模态
    weight: null
    target_data_form: null
    requirement: 衡量视觉清晰程度，不应存在水印、抖动、字幕遮挡、条纹等问题。
    measurement_method: null

  - code: "02080306"
    name: 视频动态范围
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 视频模态
    weight: null
    target_data_form: null
    requirement: 衡量视频可表现亮度和暗度的范围，HDR 视频动态范围大于 SDR 视频。
    measurement_method: null

  - code: "02080401"
    name: 音频信噪比
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 音频模态
    weight: null
    target_data_form: null
    requirement: 衡量音频信号与背景噪声的比值，信噪比越高表示音频质量越好。
    measurement_method: null

  - code: "02080402"
    name: 信号失真比
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 音频模态
    weight: null
    target_data_form: null
    requirement: 衡量目标信号与噪声、干扰等信号的强度比值，数值越高表示音频质量越好。
    measurement_method: null

  - code: "02080403"
    name: 音频采样率
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 音频模态
    weight: null
    target_data_form: null
    requirement: 衡量音频数据采样频率，采样率越高，音频还原度越好。
    measurement_method: null

  - code: "02080404"
    name: 音频位深度
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 音频模态
    weight: null
    target_data_form: null
    requirement: 衡量音频数据量化精度，位深度越高，动态范围和分辨率越好。
    measurement_method: null

  - code: "02080405"
    name: 音频比特率
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 音频模态
    weight: null
    target_data_form: null
    requirement: 衡量音频数据传输速率，比特率越高，音频质量通常越好。
    measurement_method: null

  - code: "02080406"
    name: 音频时长
    node_type: sub_metric
    dimension: 数据质量
    parent_code: "0208"
    modality_group: 音频模态
    weight: null
    target_data_form: null
    requirement: 衡量音频播放时间长度，时长过短可能导致内容不完整或信息量不足。
    measurement_method: null

  - code: "0301"
    name: 内容多样性
    node_type: metric
    dimension: 模型应用
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据集
    requirement: 数据分布全面程度满足目标应用场景模型开发和训练需求。
    measurement_method: X = A / B，其中 A 为数据集分布覆盖范围，B 为目标应用场景所需的数据集分布覆盖范围。

  - code: "0302"
    name: 规模完整性
    node_type: metric
    dimension: 模型应用
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据集
    requirement: 数据集规模满足目标应用场景模型开发和训练所需规模。
    measurement_method: X = A / B，其中 A 为数据集规模，B 为目标应用场景所需的数据集规模。

  - code: "0303"
    name: 内容时效性
    node_type: metric
    dimension: 模型应用
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据记录
    requirement: 数据采集时间和更新状态满足目标应用场景模型开发和训练要求。
    measurement_method: X = A / B，其中 A 为满足采集时间和更新状态要求的数据记录数量，B 为数据记录总数。

  - code: "0304"
    name: 标注准确性
    node_type: metric
    dimension: 模型应用
    parent_code: null
    modality_group: null
    weight: 0.25
    target_data_form: 数据记录
    requirement: 标注能精准标记出目标应用场景模型开发和训练所需的所有信息；无监督机器学习等不需要标注的场景不适用。
    measurement_method: X = A / B，其中 A 为能精准标记所需全部信息的数据记录数量，B 为数据记录总数。

  - code: "0305"
    name: 模型适配性
    node_type: metric
    dimension: 模型应用
    parent_code: null
    modality_group: null
    weight: 指示函数
    target_data_form: 数据集
    requirement: 使用数据集开发和训练的模型在目标应用场景中达到预期性能水平的程度。
    measurement_method: 若性能指标越高越好，X = A / B；若性能指标越低越好，X = B / A。其中 A 为实际模型性能，B 为预期模型性能。
